# D:\Repositories\Manager\AtriumPyTools\tools\lexicon\pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicon"
version = "0.2.0"
description = "雅思词库工具链：构建词库、ECDICT 补全、语料例句与搭配、认词判定、分层词表合并"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # 纯标准库

[project.scripts]
lexicon = "lexicon.cli:main"

[tool.setuptools]
packages = ["lexicon"]
